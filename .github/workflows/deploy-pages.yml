# main 브랜치에 push 하면 GitHub Pages로 자동 배포
# 권장: 저장소 Settings > Pages > Build and deployment > Source 를 "GitHub Actions" 로 설정
# Source 가 "Deploy from a branch" 로 남아 있으면 GitHub 기본 배포(pages build and deployment)가
# README 를 Jekyll 페이지로 만들어 사이트를 덮어쓰므로, 같은 커밋의 그 배포가 끝날 때까지 기다렸다가 배포한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for GitHub default branch deploy (README) to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=20" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$pending" = "0" ] && exit 0
            sleep 15
          done
      - id: deployment
        uses: actions/deploy-pages@v4
