# main 브랜치에 push 하면 GitHub Pages로 자동 배포
# 권장: 저장소 Settings > Pages > Build and deployment > Source 를 "GitHub Actions" 로 설정
# Source 가 "Deploy from a branch" 로 남아 있으면 GitHub 기본 배포(pages build and deployment)가
# README 를 Jekyll 페이지로 만들어 사이트를 덮어쓰므로, 그 배포가 끝난 뒤 한 번 더 배포한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
